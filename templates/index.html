<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Danish number translator</title>
</head>
<body>
    <div class="page">
        <header class="header">
            <h1>Danish Number Word Generator</h1>
            <p class="description">Enter a non-negative integer and press Generate to convert it to Danish words.</p>
        </header>

        <main class="card">
            <form method="post" novalidate>
                <label for="number">Non-negative integer</label>
                <input
                    id="number"
                    name="number"
                    type="string"
                    value="{{ value }}"
                    placeholder="e.g. 123"
                    required
                >

                <fieldset class="option-group option-group--horizontal">
                    <legend>Separator</legend>
                    <label>
                        <input type="radio" name="seperator" value="none" {% if seperator == 'none' %}checked{% endif %}>
                        None
                    </label>
                    <label>
                        <input type="radio" name="seperator" value="space" {% if seperator == 'space' %}checked{% endif %}>
                        Space
                    </label>
                    <label>
                        <input type="radio" name="seperator" value="hyphen" {% if seperator == 'hyphen' %}checked{% endif %}>
                        Hyphen
                    </label>
                </fieldset>

                <fieldset class="option-group">
                    <legend>Options</legend>
                    <label>
                        <input type="checkbox" name="et_before_hundrede" value="yes" {% if et_before_hundrede %}checked{% endif %}>
                        Et before hundred
                    </label>
                    <label>
                        <input type="checkbox" name="et_before_tusinde" value="yes" {% if et_before_tusinde %}checked{% endif %}>
                        Et before tusinde
                    </label>
                </fieldset>
                <button type="submit">Generate</button>
            </form>

            <div class="result-block">
                <h2>Result</h2>
                {% if error %}
                    <p class="error">{{ error }}</p>
                {% elif result %}
                    <p class="result">{{ result }}</p>
                {% else %}
                    <p class="hint">The Danish words for your number will appear here after pressing Generate.</p>
                {% endif %}
            </div>
        </main>
    </div>
</body>
</html>
